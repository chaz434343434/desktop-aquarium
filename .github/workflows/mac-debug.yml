# Experiments for the Apple Silicon build (run by hand): one real build, launched different ways.
name: Mac debug

on:
  workflow_dispatch:

jobs:
  launch:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pygame==2.6.1 pyinstaller pyobjc-framework-Cocoa pillow
      - name: Build
        run: sh build_assets/build_mac.sh > build.log 2>&1 || { tail -40 build.log; exit 1; }
      - name: Smoke variants
        run: |
          for caps in "" "8.0" "3.0,4.7,9.7,13.0"; do
            echo "== screencapture at: [$caps]"
            DA_CAPS="$caps" python build_assets/mac_smoke.py "out/shots_${caps}" 2>&1 | grep -E "exit code|SMOKE"
          done
          true
