# By hand only: build a given version and launch it many times to catch rare crashes.
name: Mac debug

on:
  workflow_dispatch:

jobs:
  repeat:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-14]
        ref: [v1.4.0, v1.4.1]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pygame==2.6.1 pyinstaller pyobjc-framework-Cocoa pillow
      - name: Build
        run: sh build_assets/build_mac.sh > build.log 2>&1 || { tail -40 build.log; exit 1; }
      - name: Launch 8 times
        run: |
          EXE="dist/Desktop Aquarium.app/Contents/MacOS/Desktop Aquarium"
          export DA_UPDATE_API=http://127.0.0.1:9/x
          for i in 1 2 3 4 5 6 7 8; do
            DA_FAULTLOG=/tmp/fault$i.txt "$EXE" --fresh --demo --script --seconds 16 --save /tmp/s$i.json > /dev/null 2>&1
            code=$?
            echo "${{ matrix.ref }} run $i: exit $code"
            if [ $code -ne 0 ]; then head -30 /tmp/fault$i.txt; fi
          done
          true
