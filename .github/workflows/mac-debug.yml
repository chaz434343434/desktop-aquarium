# By hand only: resize stress test, old window handling (DA_OLD_WINDOW=1) vs the fix.
name: Mac debug

on:
  workflow_dispatch:

jobs:
  resize:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pygame==2.6.1 pyinstaller pyobjc-framework-Cocoa pillow
      - name: Build
        run: sh build_assets/build_mac.sh > build.log 2>&1 || { tail -40 build.log; exit 1; }
      - name: Resize stress, old vs fixed
        run: |
          set +e
          EXE="dist/Desktop Aquarium.app/Contents/MacOS/Desktop Aquarium"
          export DA_UPDATE_API=http://127.0.0.1:9/x
          for mode in old fixed; do
            for i in 1 2 3 4; do
              if [ $mode = old ]; then export DA_OLD_WINDOW=1; else unset DA_OLD_WINDOW; fi
              "$EXE" --fresh --stress-resize --seconds 15 --save /tmp/s_$mode$i.json > /dev/null 2>&1
              echo "RESULT $mode run $i: exit $?"
            done
          done
          true
