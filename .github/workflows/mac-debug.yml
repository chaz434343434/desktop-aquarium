# Experiments for the Apple Silicon build (run by hand): the real build script with parts
# switched off, then the real smoke test.
name: Mac debug

on:
  workflow_dispatch:

jobs:
  variant:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full
            env: DA_X=1
          - name: no-icon
            env: DA_NO_ICON=1
          - name: no-bundle-id
            env: DA_NO_BID=1
          - name: no-plist
            env: DA_NO_PLIST=1
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pygame==2.6.1 pyinstaller pyobjc-framework-Cocoa pillow
      - name: Build
        run: export ${{ matrix.env }}; sh build_assets/build_mac.sh > build.log 2>&1 || { tail -40 build.log; exit 1; }
      - name: Smoke
        run: |
          export DA_FAULTLOG=$PWD/fault.txt
          python build_assets/mac_smoke.py out/shots 2>&1 | grep -v "^   " | head -20 || true
          echo "---- fault log"; cat fault.txt || true
