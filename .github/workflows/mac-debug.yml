# Experiments for the Apple Silicon build (run by hand): one real build, launched different ways.
name: Mac debug

on:
  workflow_dispatch:

jobs:
  launch:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pygame==2.6.1 pyinstaller pyobjc-framework-Cocoa pillow
      - name: Build
        run: sh build_assets/build_mac.sh > build.log 2>&1 || { tail -40 build.log; exit 1; }
      - name: Launch matrix
        run: python build_assets/mac_launch_matrix.py
